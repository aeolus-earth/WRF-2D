[project]
name = "fortran-torch-adaptor"
version = "0.1.0"
description = "provides static library files to be used to module_fast_sbm"
authors = [
  { name="Toby Bischoff", email="toby@aeolus.earth" }
  { name="Ryan Yang", email="ryan@aeolus.earth" }
]
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.20.0"
]
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
generate-model = "src.python.generate_model:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"